name: Build and Push to GCP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: jennipro-dev
  GAR_LOCATION: us-central1
  REPOSITORY: scrapper-locally
  SERVICE: scraper-locally
  GITOPS_REPO: git@github.com:Zero-Stack-Labs/jenni-k8s-configs.git
  MANIFEST_PATH: apps/scraper-locally/deployment.yaml

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/71269304760/locations/global/workloadIdentityPools/github-pool/providers/github-provider
        service_account: github-actions@jennipro-dev.iam.gserviceaccount.com

    - name: Ensure Artifact Registry repository exists
      run: |
        # Check if repository exists, create if it doesn't
        if ! gcloud artifacts repositories describe $REPOSITORY --location=$GAR_LOCATION --project=$PROJECT_ID >/dev/null 2>&1; then
          echo "Repository $REPOSITORY does not exist. Creating..."
          gcloud artifacts repositories create $REPOSITORY \
            --repository-format=docker \
            --location=$GAR_LOCATION \
            --description="Auto-created repository for $SERVICE" \
            --project=$PROJECT_ID
          echo "Repository $REPOSITORY created successfully!"
        else
          echo "Repository $REPOSITORY already exists."
        fi

    - name: Configure Docker to use gcloud as a credential helper
      run: |
        gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

    - name: Get short SHA
      id: vars
      run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ steps.vars.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Show image details
      run: |
        echo "Image built and pushed:"
        echo "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:latest"
        echo "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ steps.vars.outputs.SHORT_SHA }}"

  deploy-to-argo:
    name: Deploy to ArgoCD
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get short SHA
      id: vars
      run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

    - name: Setup SSH key for GitOps repo
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.GITOPS_SSH_KEY }}

    - name: Clone GitOps repository
      run: |
        git clone ${{ env.GITOPS_REPO }} gitops-repo
        cd gitops-repo

    - name: Update Kubernetes manifest
      run: |
        cd gitops-repo
        sed -i "s|${{ env.SERVICE }}:.*|${{ env.SERVICE }}:${{ steps.vars.outputs.SHORT_SHA }}|" ${{ env.MANIFEST_PATH }}

    - name: Commit and push changes
      run: |
        cd gitops-repo
        git config user.email "github-actions@jennipro.com"
        git config user.name "GitHub Actions"
        git add ${{ env.MANIFEST_PATH }}
        git commit -m "Deploy ${{ env.SERVICE }}:${{ steps.vars.outputs.SHORT_SHA }} from ${{ github.repository }}@${{ github.sha }}"
        git push origin main

    - name: Deployment summary
      run: |
        echo "✅ Deployment completed!"
        echo "🎯 ArgoCD will automatically sync the changes"
        echo "📦 Image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ steps.vars.outputs.SHORT_SHA }}"
        echo "📂 GitOps repo updated: ${{ env.GITOPS_REPO }}" 